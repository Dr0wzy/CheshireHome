                label: Small heading
                type: string
              - name: title
                label: Title
                type: string
              - name: items
                label: Cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: icon
                    label: Icon
                    type: image
                  - name: value
                    label: Number
                    type: string
